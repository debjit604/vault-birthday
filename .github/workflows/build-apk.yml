name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: true

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Verify web assets were synced
        run: |
          grep -q native-notifications.bundle.js www/index.html
          cmp www/app.js android/app/src/main/assets/public/app.js
          cmp www/index.html android/app/src/main/assets/public/index.html

      - name: Restore fixed signing key
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          VC="${{ github.run_number }}"
          if [ -z "$VC" ] || ! [[ "$VC" =~ ^[0-9]+$ ]]; then VC=1; fi
          echo "Building with versionCode=$VC"
          ./gradlew assembleDebug -Pvc="$VC" --stacktrace --no-daemon

      - name: Prove the APK contains this build
        run: |
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/public/app.js | cmp - app.js
          cp android/app/build/outputs/apk/debug/app-debug.apk vault-birthday.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vault-birthday-apk
          path: vault-birthday.apk
          retention-days: 30

      - name: Publish permanent "latest" release
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest vault-birthday.apk --target "$GITHUB_SHA" \
            --title "Latest build #${{ github.run_number }}" --notes "Commit $GITHUB_SHA"
